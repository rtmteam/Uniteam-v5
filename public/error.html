<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniteam - تعذر الاتصال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-user-select: none;
      user-select: none;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #7f1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 34px;
    }
    h1 { font-size: 21px; font-weight: 800; margin-bottom: 12px; color: #f8fafc; }
    p { font-size: 14px; line-height: 1.9; color: #94a3b8; font-weight: 600; }
    ul {
      text-align: right;
      margin: 18px 0 4px;
      padding: 16px;
      background: rgba(15, 23, 42, .6);
      border: 1px solid #334155;
      border-radius: 14px;
      list-style: none;
    }
    li {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 700;
      padding: 7px 0;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    li::before { content: "•"; color: #3b82f6; font-size: 18px; line-height: 1.1; }
    button {
      margin-top: 22px;
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; transform: scale(.98); }
    .brand {
      margin-top: 20px;
      font-size: 11px;
      color: #475569;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>تعذر الاتصال بالخادم</h1>
    <p>لم يتمكن التطبيق من تحميل البيانات. غالباً السبب أحد الأمور التالية:</p>
    <ul>
      <li>الهاتف غير متصل بالإنترنت</li>
      <li>شبكة الواي فاي أو بيانات الهاتف ضعيفة</li>
      <li>الخادم تحت الصيانة مؤقتاً</li>
    </ul>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <div class="brand">Uniteam</div>
  </div>
</body>
</html>
