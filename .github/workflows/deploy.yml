name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يسمح لك بتشغيل العملية يدوياً من تبويب Actions

permissions:
  contents: read
  pages: write
  id-token: write

# منع تشغيل أكثر من عملية نشر في نفس الوقت
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    # مطلوبة لـ actions/deploy-pages@v4 - بدونها يفشل النشر
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ملاحظة: نستخدم `npm install` وليس `npm ci`.
      # ملف package-lock.json أُنشئ على ويندوز، و `npm ci` قد يفشل على Ubuntu
      # بالخطأ: Cannot find module @rollup/rollup-linux-x64-gnu
      - name: Install Dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
