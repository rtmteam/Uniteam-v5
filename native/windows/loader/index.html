<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniteam</title>
<style>
  :root { --bg: #0A1428; --card: #12203d; --text: #EAF0FA; --muted: #9FB0CC; --accent: #2F6BFF; --warn: #F5B544; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box { width: 100%; max-width: 420px; text-align: center; background: var(--card); border-radius: 24px; padding: 40px 28px; }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: 2px; margin: 0 0 24px; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 20px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.15); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  p { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0; }
  .icon { font-size: 40px; color: var(--warn); margin-bottom: 12px; }
  button { margin-top: 24px; width: 100%; min-height: 48px; border: 0; border-radius: 16px;
    background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="box">
    <p class="brand">UNITEAM</p>

    <section id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>جارٍ الاتصال…</h1>
      <p>يتم فتح التطبيق، لحظات من فضلك.</p>
    </section>

    <section id="offline" hidden>
      <div class="icon" aria-hidden="true">⚠</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تأكد من اتصال الجهاز بالشبكة ثم اضغط «إعادة المحاولة».<br>سيُفتح التطبيق تلقائياً عند عودة الاتصال.</p>
      <button id="retry" type="button">إعادة المحاولة</button>
    </section>
  </main>

<script>
(function () {
  'use strict';
  var desk = window.UniteamDesktop || {};
  var url = desk.appUrl || 'https://rtmteam.github.io/Uniteam-v6/';
  var loading = document.getElementById('loading');
  var offline = document.getElementById('offline');
  var retry = document.getElementById('retry');
  var busy = false;

  function show(isOffline) {
    loading.hidden = isOffline;
    offline.hidden = !isOffline;
    retry.disabled = false;
  }

  // نتحقق من الوصول للموقع قبل الانتقال إليه، حتى لا تظهر صفحة الخطأ الافتراضية
  function tryOpen() {
    if (busy) return;
    busy = true;
    show(false);
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    fetch(url + 'manifest.json?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function () { clearTimeout(timer); window.location.replace(url); })
      .catch(function () { clearTimeout(timer); busy = false; show(true); });
  }

  retry.addEventListener('click', function () { retry.disabled = true; tryOpen(); });
  window.addEventListener('online', tryOpen);
  tryOpen();
})();
</script>
</body>
</html>
